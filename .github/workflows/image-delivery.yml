name: MediaEX image delivery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: mediaex-image-monitor
  cancel-in-progress: false
jobs:
  image-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/test-image-delivery-monitor.mjs
      - run: node scripts/check-image-delivery.mjs
        env:
          MEDIAEX_URL: ${{ vars.MEDIAEX_MONITOR_URL }}
          MEDIAEX_MONITOR_WORKSPACE: ${{ vars.MEDIAEX_MONITOR_WORKSPACE }}
          MEDIAEX_MONITOR_KEY: ${{ secrets.MEDIAEX_MONITOR_KEY }}
