name: Media governance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policies-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediaex_governance_fixture
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fixture:disposable-ci-only@127.0.0.1:5432/mediaex_governance_fixture
      MEDIA_WORKER: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Apply migrations and exercise media governance
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          node --experimental-strip-types backend/migrate.mts
          node --experimental-strip-types --test scripts/test-upload-presets.mjs
          node --experimental-strip-types --test scripts/test-asset-recovery.mjs
          node --experimental-strip-types --test scripts/test-private-delivery.mjs
