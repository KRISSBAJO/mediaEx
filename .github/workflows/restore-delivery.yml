name: Isolated media restore
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restored-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Install fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 ffmpeg
      - name: Recover catalog, media bytes and existing viewer links
        run: PATH="/usr/lib/postgresql/16/bin:$PATH" node --experimental-strip-types scripts/check-offline-restore.mjs --live-db
