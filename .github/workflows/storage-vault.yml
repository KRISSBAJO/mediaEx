name: MediaEX storage vault pilot
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'app/admin/workspaces/**'
      - 'components/admin/**'
      - 'lib/backend.ts'
      - 'scripts/test-storage-vault*'
      - '.github/workflows/storage-vault.yml'
permissions:
  contents: read
jobs:
  authenticated-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mediaex_vault_fixture
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Exercise authenticated studio administration against a disposable database
        env:
          DATABASE_URL: postgresql://fixture:disposable-ci-only@127.0.0.1:5432/mediaex_vault_fixture
          BETTER_AUTH_URL: https://mediaex.example.test
          MEDIAEX_TEST_STORAGE_ADMIN: '1'
          NODE_ENV: production
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          node --experimental-strip-types backend/migrate.mts
          node --experimental-strip-types scripts/test-storage-vault-offline.mts
  rotate-and-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm run build --prefix backend
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node --experimental-strip-types scripts/test-storage-vault-offline.mts
      - run: python3 scripts/test-storage-vault.py
